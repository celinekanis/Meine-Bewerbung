<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt – Celine Kanis</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat&display=swap');

body {
  margin:0;
  font-family:Montserrat, sans-serif;
  background:#c4d5e4;
}

header { 
  background:#0B769F; 
  padding:20px; 
}

.burger {
  display:none;
  font-size:1.8rem;
  background:none;
  border:none;
  color:white;
}

nav {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
}

  nav ul { 
  list-style:none; 
  display:flex; 
  flex-wrap:wrap; 
  justify-content:center; 
  gap:15px; 
  margin:0; 
  padding:0; 
}

nav a { 
  color:white; 
  text-decoration:none; 
  font-weight:bold; 
}

main {
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:70vh;
}

.contact-box {
  background:white;
  border-radius:12px;
  padding:40px 60px;
  box-shadow:0 4px 25px rgba(0,0,0,.1);
  text-align:center;
  max-width:650px;
  border-top:6px solid #0B769F;
  border-bottom:6px solid #0B769F;
}

h1 {
  color:#0B769F;
  font-variant:small-caps;
  margin-bottom:20px;
}

.contact-info a {
  display:block;
  margin:10px 0;
  color:#0B769F;
  font-weight:bold;
  text-decoration:none;
}

footer {
  background:#0B769F;
  color:white;
  text-align:center;
  padding:20px;
}

@media(max-width:768px) {
  header {
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }

  .burger { 
    display:block; 
    position: relative;
    z-index: 1001;
  }

  nav { 
    position: fixed;
    top: 0;
    right: -100%; /* Startet außerhalb rechts */
    width: 250px;
    height: 100%;
    background: #0B769F;
    padding-top: 80px;
    transition: right 0.4s ease;
    box-shadow: -5px 0 15px rgba(0,0,0,0.2);
    z-index: 1000;
    display: block !important;
  }

  nav.active { 
    right: 0; /* Slidet rein */
  }

  nav ul { 
    flex-direction:column; 
    gap:20px; 
    text-align:center; 
  }

  .contact-box { padding:30px 25px; }
}
  
</style>
  
</head>

<body>
  
<header>
  <button class="burger" onclick="toggleMenu()" aria-label="Menü öffnen">☰</button>

      <li><a href="kontakt.html">Kontakt</a></li>
    </ul>
  </nav>
</header>

<script>
function toggleMenu(){ 
  document.getElementById("nav").classList.toggle("active"); 
  
  const btn = document.querySelector('.burger');
  if(document.getElementById("nav").classList.contains("active")) {
    btn.innerHTML = "✕";
  } else {
    btn.innerHTML = "☰";
  }
}
</script>

<main>

<h1>Kontakt</h1>

</div>
</div>
</main>

<footer>
<p>© 2026 Celine Kanis</p>
</footer>


</body>
