<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motivation – Celine Kanis</title>

<style>
:root {
  --primary:#0B769F;
  --background:#c4d5e4;
  --text:#222;
  --white:#fff;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:"Montserrat", sans-serif;
  background:var(--background);
  color:var(--text);
}

header {
  background:var(--primary);
  padding:20px;
}

.burger {
  display:none;
  font-size:1.8rem;
  background:none;
  border:none;
  color:white;
  cursor:pointer;
}

nav {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
}

nav a {
  color:white;
  text-decoration:none;
  font-weight:bold;
}

nav a:hover {
  color:#c4d5e4;
}

main {
  background:white;
  border-radius:10px;
  padding:50px 70px;
  box-shadow:0 3px 20px rgba(0,0,0,.1);
  max-width:1300px;
  margin:70px auto;
}

h1 {
  color:var(--primary);
  border-bottom:3px solid var(--primary);
  padding-bottom:8px;
  margin-bottom:30px;
  font-variant:small-caps;
}

p {
  line-height:1.8;
  font-size:1.05rem;
  margin-bottom:20px;
}

footer {
  background:var(--primary);
  color:white;
  text-align:center;
  padding:20px;
  margin-top:60px;
}

footer a { color:#c4d5e4; }

/* Mobile */
@media(max-width:768px){
  nav { display:none; flex-direction:column; }
  nav.active { display:flex; }
  .burger { display:block; margin:auto; }
  main { padding:30px 25px; margin:40px 20px; }
}
</style>
</head>

<body>

<header>
<button class="burger" onclick="toggleMenu()">☰</button>
<nav id="nav">

  <a href="about.html">Über mich</a>
  <a href="motivation.html">Motivation</a>
  <a href="CV.html">Lebenslauf</a>
  <a href="dokumente.html">Dokumente</a>
  <a href="portfolio.html">Portfolio</a>
  <a href="kontakt.html">Kontakt</a>
</nav>
</header>

<main>
<h1>Meine Motivation</h1>
<p>Softwareentwicklung verbindet für mich Logik, Kreativität und den Reiz, durch präzises Denken echte Lösungen zu schaffen.</p>
</main>

<footer>
<p>© 2026 Celine Kanis | <a href="mailto:celine.kanis@gmail.com">Kontakt aufnehmen</a></p>
</footer>

function toggleMenu() {
  document.getElementById("nav").classList.toggle("active");
}
</script>

</body>
</html>
