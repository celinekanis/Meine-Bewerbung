<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio – Celine Kanis</title>

<style>
:root {
  --primary: #0B769F;
  --background: #c4d5e4;
  --text: #222;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Montserrat", sans-serif;
  background-color: var(--background);
  color: var(--text);
}

/* Header */
header {
  background-color: var(--primary);
  padding: 20px;
}

nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
}

nav a {
  color: var(--white);
  text-decoration: none;
  font-weight: bold;
  transition: color 0.3s ease;
}

nav a:hover {
  color: var(--background);
}

/* Main Box */
main {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 70vh;
  padding: 40px;
}

.box {
  background: var(--white);
  border-radius: 12px;
  padding: 50px 70px;
  box-shadow: 0 3px 20px rgba(0,0,0,0.1);
  max-width: 700px;
  width: 100%;
  text-align: center;
}

h1 {
  color: var(--primary);
  border-bottom: 3px solid var(--primary);
  padding-bottom: 8px;
  margin-bottom: 25px;
  font-variant: small-caps;
  font-weight: bolder;
  font-size: 1.8rem;
}

p {
  line-height: 1.8;
  font-size: 1.05rem;
  margin-bottom: 18px;
}

.box a {
  display: inline-block;
  margin-top: 10px;
  color: var(--primary);
  text-decoration: none;
  font-weight: bold;
}

.box a:hover {
  text-decoration: underline;
}

/* Footer */
footer {
  background: var(--primary);
  color: var(--white);
  text-align: center;
  padding: 20px;
  font-size: 0.9rem;
  margin-top: 60px;
}

footer a {
  color: var(--background);
  text-decoration: none;
}

/* Responsive */
@media (max-width: 768px) {
  .box {
    padding: 35px 25px;
  }
  h1 {
    font-size: 1.6rem;
  }
}
</style>
</head>
