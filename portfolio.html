<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio – Celine Kanis</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: "Montserrat", sans-serif;
      background-color:#c4d5e4;
      margin: 0;
      color: #222;
      line-height: 1.7;
    }
    /* Zusatz-Styles für Kontaktseite */
    main {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 70vh;
      padding: 40px;
    }
    .portfolio {
      background: #ffffff;
      border-radius: 12px;
      padding: 40px 60px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 600px;
      width: 100%;
      border-top: 6px solid #0B769F;
      border-bottom: 6px solid #0B769F;
    }
    h1 {
      color: #0B769F;
      font-variant: small-caps;
      font-weight: bolder;
      margin-bottom: 25px;
    }
    p {
      color: #222;
      line-height: 1.8;
      font-size: 1.05rem;
      margin-bottom: 15px;
    }
    .portfolio {
      margin-top: 25px;
    }
    .portfolio a {
      display: block;
      color: #0B769F;
      text-decoration: none;
      font-weight: bold;
      margin: 8px 0;
      transition: color 0.3s;
    }
    .portfolio a:hover {
      color: #004aad;
    }
    header {
      background-color: #0B769F;
      padding: 20px;
      text-align: center;
    }
   nav ul { list-style:none; display:flex; flex-wrap:wrap; justify-content:center; gap:15px; margin:0; padding:0; }
   nav ul li { margin:0; }

   nav a { color:white; text-decoration:none; font-weight:bold; transition:color 0.3s; }
   nav a:hover { color:#c4d5e4; }

   .burger { display:none; font-size:1.8rem; background:none; border:none; color:white; cursor:pointer; }

   @media(max-width:768px){
  nav { display:none; }
  nav.active { display:block; }
  nav ul { flex-direction:column; gap:12px; text-align:center; }
  .burger { display:block; margin:auto; }
  }
  }
    footer {
      background: #0B769F;
      color: #fff;
      text-align: center;
      padding: 20px 0;
      font-size: 0.9em;
      border-top: 4px solid #0B769F;
    }
    footer a {
      color: #c4d5e4;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

</header>

function toggleMenu(){ document.getElementById("nav").classList.toggle("active"); }
</script>
